<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="20" y1="18" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1e3a8a" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Shield Frame -->
  <path d="M32 4L10 12V28C10 43.5 19.5 54.5 32 60C44.5 54.5 54 43.5 54 28V12L32 4Z" 
        fill="url(#shieldGrad)" 
        stroke="#60a5fa" 
        stroke-width="2" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Shield Inner Bevel Line -->
  <path d="M32 8L14 14.5V28C14 41 21.8 50.5 32 55.2C42.2 50.5 50 41 50 28V14.5L32 8Z" 
        fill="none" 
        stroke="#93c5fd" 
        stroke-width="1" 
        opacity="0.4" />

  <!-- Lock Shackle -->
  <path d="M25 27V21C25 17.134 28.134 14 32 14C35.866 14 39 17.134 39 21V27" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" />

  <!-- Lock Body -->
  <rect x="22" y="27" width="20" height="17" rx="3.5" 
        fill="url(#goldGrad)" 
        stroke="#ca8a04" 
        stroke-width="1.5" />

  <!-- Keyhole -->
  <circle cx="32" cy="33.5" r="2.2" fill="#1e293b" />
  <path d="M30.8 33.5L29.8 40H34.2L33.2 33.5Z" fill="#1e293b" />
</svg>
